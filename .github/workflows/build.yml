name: Собрать APK и сайт

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-and-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Сборка APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk Skupka.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Skupka-apk
          path: Skupka.apk

      - name: Выложить APK в Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" Skupka.apk \
            --title "Скупка 1.0 (сборка ${{ github.run_number }})" \
            --notes "Плавающий калькулятор для скупки ресурсов. Скачайте Skupka.apk и установите на Android 8.0+." \
            --latest

  site:
    needs: build
    runs-on: ubuntu-latest
    # Сайт публикуется, только если в настройках репозитория включён GitHub Pages (Source: GitHub Actions).
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
