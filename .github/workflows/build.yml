name: Собрать APK и сайт

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-and-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Тесты расчёта
        run: |
          mkdir -p /tmp/t
          javac -encoding UTF-8 -d /tmp/t app/src/main/java/com/semen/skupka/Logic.java tests/com/semen/skupka/LogicTest.java
          java -cp /tmp/t com.semen.skupka.LogicTest

      - name: Сборка APK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk Skupka.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Skupka-apk
          path: Skupka.apk

      - name: Выложить APK в Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v2.0.${{ github.run_number }}" Skupka.apk \
            --title "Скупка 2.0 (сборка ${{ github.run_number }})" \
            --notes "Помощник скупки: цены, проверка трейда, объявления, журнал. Скачайте Skupka.apk и установите на Android 8.0+." \
            --latest

  site:
    needs: build
    runs-on: ubuntu-24.04
    # Сайт публикуется, только если в настройках репозитория включён GitHub Pages (Source: GitHub Actions).
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
